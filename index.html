<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kirinyaga University | Countdown to August 25, 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #020205;
            color: #00f3ff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        /* High-Tech Tech Grid & Space Background */
        #tech-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center;
            background: radial-gradient(circle at center, rgba(0, 243, 255, 0.05) 0%, rgba(2, 2, 5, 0.8) 100%);
        }

        .tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #00f3ff;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        h1 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 3rem; 
            font-weight: 900;
            color: #ffffff; 
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00f3ff;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .subtitle { 
            font-size: 1.4rem; 
            letter-spacing: 3px; 
            margin-bottom: 40px; 
            color: #a5f3fc;
            text-transform: uppercase;
        }

        .timer { 
            display: flex; 
            gap: 20px; 
            margin-top: 10px; 
        }

        .unit-box {
            background: rgba(0, 10, 20, 0.7);
            border: 1px solid #00f3ff;
            padding: 20px 15px;
            min-width: 90px;
            border-radius: 8px;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.2), 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .unit { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem; 
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px #00f3ff;
        }

        .label { 
            font-size: 0.8rem; 
            display: block; 
            opacity: 0.8; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-top: 5px;
            color: #00f3ff;
        }
    </style>
</head>
<body>

    <canvas id="tech-canvas"></canvas>

    <div class="container">
        <div class="tag">System Initialization</div>
        <h1>Kirinyaga University</h1>
        <div class="subtitle">Joining Target: August 25th, 2026</div>

        <div class="timer">
            <div class="unit-box"><span class="unit" id="days">00</span><span class="label">Days</span></div>
            <div class="unit-box"><span class="unit" id="hours">00</span><span class="label">Hours</span></div>
            <div class="unit-box"><span class="unit" id="minutes">00</span><span class="label">Mins</span></div>
            <div class="unit-box"><span class="unit" id="seconds">00</span><span class="label">Secs</span></div>
        </div>
    </div>

    <script>
        // High-Tech Cyber Space Background Logic
        const canvas = document.getElementById('tech-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Particles representing data nodes / stars moving in space
        const particles = Array.from({length: 120}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            z: Math.random() * canvas.width,
            size: Math.random() * 1.8 + 0.5
        }));

        function drawTechSpace() {
            ctx.fillStyle = 'rgba(2, 2, 5, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            particles.forEach(p => {
                p.z -= 1.5; // Move towards viewer
                if (p.z <= 0) p.z = canvas.width;

                const k = 250 / p.z;
                const px = p.x * k + cx;
                const py = p.y * k + cy;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    const size = Math.max(1, p.size * k);
                    const opacity = Math.min(1, 1 - p.z / canvas.width);
                    
                    ctx.fillStyle = `rgba(0, 243, 255, ${opacity})`;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            requestAnimationFrame(drawTechSpace);
        }
        drawTechSpace();

        // Countdown Timer Logic for August 25, 2026
        const target = new Date("August 25, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = target - now;

            if (diff > 0) {
                document.getElementById("days").innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                document.getElementById("hours").innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
                document.getElementById("minutes").innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                document.getElementById("seconds").innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
            } else {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
            }
        }, 1000);
    </script>
</body>
</html>
